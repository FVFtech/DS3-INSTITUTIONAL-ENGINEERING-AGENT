name: Institutional Agent CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: TOML verification
        run: python -c "import tomllib,pathlib; tomllib.loads(pathlib.Path('pyproject.toml').read_text())"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src/ds3_agent/control_plane.py src/ds3_agent/scoped_tools.py src/ds3_agent/orchestrator.py tests/test_control_plane.py tests/test_orchestrator.py --select E4,E7,E9,F
