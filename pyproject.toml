[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds3-institutional-engineering-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
evolution = ["dspy-ai>=2.6.0"]
evolution = ["dspy-ai>=2.6.0"]

[project.scripts]
ds3-agent = "ds3_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
